<div class="container">
  <h1>ล้างคิว</h1>

  <div *ngIf="clearedNumber" class="cleared-number-display">
    {{ clearedNumber }}
  </div>

  <div *ngIf="!clearedNumber" class="clear-actions">
    <p class="confirm-message">คุณยืนยันที่จะล้างคิวใช่หรือไม่?</p>
    <button class="btn btn-danger" (click)="clearQueue()" [disabled]="isLoading">
      <span *ngIf="!isLoading">ยืนยันล้างคิว</span>
      <span *ngIf="isLoading" class="spinner"></span>
    </button>
  </div>

  <div class="navigation-area">
    <button class="btn btn-secondary" (click)="goBack()">
      กลับหน้ารับบัตรคิว
    </button>
  </div>
</div>
