<div class="container">
  <h1>หมายเลขคิว</h1>

  <div class="ticket-display-number ticket-result-number">
    {{ ticketNumber }}
  </div>

  <div class="ticket-date" *ngIf="issuedAt">
    วันที่ : {{ issuedAt | date:'dd/MM/yyyy' }} เวลา {{ issuedAt | date:'HH:mm' }} น.
  </div>

  <div class="ticket-navigation">
    <button class="btn btn-secondary" (click)="goBack()">
      กลับหน้ารับบัตรคิว
    </button>
  </div>
</div>
