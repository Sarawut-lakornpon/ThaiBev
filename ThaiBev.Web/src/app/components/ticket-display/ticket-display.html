<main class="kiosk-container">
  <header class="kiosk-header">
    <h1>IT 05-2</h1>
  </header>
  
  <section class="main-action-area">
    <div class="label-area">
      <h2>หมายเลขคิว</h2>
    </div>

    <div class="number-area">
      <span class="ticket-number">{{ ticketNumber }}</span>
    </div>

    <div class="info-area" *ngIf="issuedAt">
      <p>วันที่ : {{ issuedAt | date:'dd/MM/yyyy' }} เวลา {{ issuedAt | date:'HH:mm' }} น.</p>
    </div>

    <div class="navigation-area">
      <button class="btn-back" (click)="goBack()">
        กลับไปหน้ารับบัตรคิว
      </button>
    </div>
  </section>
</main>
